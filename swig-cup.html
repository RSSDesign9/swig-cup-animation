<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swig Cup Spin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  :root {
    --swig-red: #E1322B;
    --swig-red-deep: #A91C17;
    --off-white: #FBF6EE;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--swig-red-deep); }
  #stage { position: fixed; inset: 0; touch-action: manipulation; }
  #stage canvas { position: absolute; inset: 0; display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%);
    font: 500 13px/1 "Instrument Sans", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
    color: var(--off-white); opacity: 0; transition: opacity .8s ease; pointer-events: none; white-space: nowrap;
  }
  #hint.show { opacity: .75; }
  #sound {
    position: fixed; right: 20px; bottom: 20px; width: 44px; height: 44px; padding: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: var(--off-white);
    background: rgb(251 246 238 / .12); border: 1px solid rgb(251 246 238 / .35); backdrop-filter: blur(6px);
    opacity: .7; transition: opacity .2s ease, background .2s ease;
  }
  #sound:hover, #sound:focus-visible { opacity: 1; background: rgb(251 246 238 / .2); }
  #sound:focus-visible { outline: 2px solid var(--off-white); outline-offset: 3px; }
  #sound svg { width: 20px; height: 20px; }
  #sound .waves { display: none; }
  #sound[aria-pressed="true"] .waves { display: inline; }
  #sound[aria-pressed="true"] .mute { display: none; }
  body.capture #hint, body.capture #sound { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
</div>
<div id="hint">Tap the cup for a refill</div>
<button id="sound" type="button" aria-pressed="false" aria-label="Sound off">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke="none"/>
    <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a7.5 7.5 0 0 1 0 11"/>
    <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>
<script src="sfx/swig-sfx.js"></script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ───────────────────────────────── config
const qs = new URLSearchParams(location.search);
const CAPTURE = qs.has('capture');
const HANDLE = (qs.get('handle') || 'RSS DESIGN').toUpperCase();
const LOOP = 8;                 // seconds per full turn; everything periodic divides this
const SPIN_ZERO = 1.6;          // logo faces camera at 1.6 (+8k), the back logo + order sticker at 5.6
const ANTICIPATE = 0.35;        // squash before each pop
const TORRENT = { dur: 2.4, anticipate: 0.6 };
// timeline: 'calm' = two pops per turn; 'torrent' (the video cut) adds a second turn whose logo pass erupts
const SEQ = qs.get('seq') || (CAPTURE ? 'torrent' : 'calm');
const PERIOD = SEQ === 'torrent' ? 16 : 8;
const SCHEDULE = [{ s: 1.6, type: 'pop' }, { s: 5.6, type: 'pop' }, ...(SEQ === 'torrent' ? [{ s: 9.6, type: 'torrent' }] : [])];
const START = 0.8;              // live page starts here so the first spurt lands fast
const G = 14;                   // gravity, world units / s²
const BRAND = {
  red: '#E1322B', redDeep: '#A91C17', offWhite: '#FBF6EE',
  cola: ['#3a0e0a', '#4b140d', '#2b0806', '#5c1c10'],
  foam: ['#dcbb96', '#e8d2b5', '#c99e74'],
};
if (CAPTURE) document.body.classList.add('capture');

// ───────────────────────────────── utils
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ───────────────────────────────── renderer / scene
const bgCanvas = document.getElementById('bg');
const glCanvas = document.getElementById('gl');
const fxCanvas = document.getElementById('fx');
const bg = bgCanvas.getContext('2d');
const fx = fxCanvas.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const BASE_FOV = +qs.get('fov') || 30;              // ?fov=&ty= reframe for other crops (e.g. portfolio thumbnails)
const camera = new THREE.PerspectiveCamera(BASE_FOV, 1, 0.1, 100);
const CAM_TY = +qs.get('ty') || 3.75;
const CAM_POS = new THREE.Vector3(0, CAM_TY + .95, 18.2);
const CAM_TARGET = new THREE.Vector3(0, CAM_TY, 0);
camera.position.copy(CAM_POS); camera.lookAt(CAM_TARGET);

// light: warm key from above-left, peach rim from behind-right, red bounce from the floor
scene.add(new THREE.HemisphereLight(0xfff4ec, 0xe1322b, 0.95));
const key = new THREE.DirectionalLight(0xfff1e6, 2.3);
key.position.set(-4.5, 12, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
key.shadow.radius = 16; key.shadow.blurSamples = 24; key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffd3c0, 1.7); rim.position.set(7, 5, -6); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe9df, 0.45); fill.position.set(7, 2, 9); scene.add(fill);

// floor: invisible, only catches shadows so the gradient stays the hero
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ color: 0x5e0c09, opacity: 0.42 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// contact blob under the floating cup
const blobTex = (() => { const c = canvas(256, 256), g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.45, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
const blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: blobTex, color: 0x4a0806, transparent: true, depthWrite: false, opacity: .35 }));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.002; scene.add(blob);

// ───────────────────────────────── cup geometry (32 oz Swig: tapered body, cup-holder step, rolled lip)
const H = 3.7;
const profileRaw = [
  [0.0, 0.0], [0.50, 0.0], [0.572, 0.010], [0.597, 0.040], [0.604, 0.09],
  [0.662, 0.90], [0.678, 0.948], [0.735, 0.995], [0.757, 1.035], [0.766, 1.09],
  [0.995, H - 0.12], [1.010, H - 0.092], [1.040, H - 0.066], [1.056, H - 0.034], [1.048, H - 0.006], [1.022, H + 0.002], [0.992, H - 0.012], [0.985, H - 0.08],

// resample by arc length so texture v is undistorted
const profile = (() => {
  const seg = []; let L = 0;

}

// ───────────────────────────────── textures
function makeBeadTexture() { // expanded-polystyrene beads, used as a bump map
  const S = 1024, c = canvas(S, S), g = c.getContext('2d'), rnd = mulberry32(3);
  g.fillStyle = '#585858'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 5400; i++) {
    const x = rnd() * S, y = rnd() * S, r = 7 + rnd() * 4.5;
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      const X = x + ox, Y = y + oy; if (X < -r || X > S + r || Y < -r || Y > S + r) continue;
      const gr = g.createRadialGradient(X - r * .25, Y - r * .25, r * .1, X, Y, r);
      gr.addColorStop(0, '#f4f4f4'); gr.addColorStop(.7, '#b8b8b8'); gr.addColorStop(1, '#6a6a6a');
      g.fillStyle = gr; g.beginPath(); g.arc(X, Y, r, 0, TAU); g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 2.4); t.colorSpace = THREE.NoColorSpace; return t;
}

function makeLogo() {
  const S = 1400, c = canvas(S, S), g = c.getContext('2d'), cx = S / 2, cy = S / 2, R = S / 2 - 6;
  g.fillStyle = BRAND.red; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
  // printed-on-foam speckle
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
  const rnd = mulberry32(7);
  for (let i = 0; i < 14000; i++) { g.fillStyle = rnd() < .55 ? 'rgba(255,255,255,0.07)' : 'rgba(80,0,0,0.08)'; g.beginPath(); g.arc(rnd() * S, rnd() * S, .8 + rnd() * 2.4, 0, TAU); g.fill(); }
  g.restore();
  // thin inner ring across the top
  g.strokeStyle = '#fff'; g.lineWidth = S * 0.017; g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, R * 0.875, Math.PI * 1.14, Math.PI * 1.86); g.stroke();
  // wordmark
  let fs = 500; g.font = `400 ${fs}px Pacifico`; fs *= (S * 0.80) / g.measureText('Swig').width; g.font = `400 ${fs}px Pacifico`;
  g.save(); g.translate(cx, cy); g.rotate(-0.06);
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillText('Swig', -S * 0.005, fs * 0.22);
  g.font = `600 ${S * 0.04}px "Instrument Sans"`; g.textAlign = 'left'; g.fillText('™', S * 0.41, -fs * 0.06);
  g.restore();

}

function makeSticker() { // thermal-printed order label, like the real ones
  const w = 900, h = 400, c = canvas(w, h), g = c.getContext('2d');
  g.fillStyle = '#fbfbf7'; g.beginPath(); g.roundRect(4, 4, w - 8, h - 8, 14); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.10)'; g.lineWidth = 3; g.stroke();
  g.fillStyle = '#262626'; g.textBaseline = 'alphabetic';
  g.font = '500 46px "IBM Plex Mono"'; g.fillText('Order 100832', 48, 112);
  g.textAlign = 'right'; g.fillText('08:08', w - 48, 112); g.textAlign = 'left';
  g.font = '600 62px "IBM Plex Mono"'; g.fillText('Diet Dr Pepper, 32oz', 48, 228);
  g.font = '500 46px "IBM Plex Mono"'; g.fillText(HANDLE.length > 22 ? HANDLE.slice(0, 22) : HANDLE, 48, 330);
  return c;
}

function makeCupTexture() {
  const Wt = 3072, Ht = 2304, c = canvas(Wt, Ht), g = c.getContext('2d'), L = profile.L;
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, Wt, Ht);

    const { s, r } = sAtY(y), cy = (1 - s / L) * Ht, w = wU * Wt / (TAU * r), h = hU * Ht / L;

  };
  // a roundel on both faces; the order label is slapped on below the back one, a touch crooked like the real thing
  const logo = makeLogo();
  place(logo, 0, 2.4, 1.46, 1.46);
  place(logo, 0.5, 2.4, 1.46, 1.46);
  place(makeSticker(), 0.5, 1.4, 1.16, 1.16 * 400 / 900, -0.035);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}

// ───────────────────────────────── cup assembly
const rig = new THREE.Group();     // float / bob
const tilt = new THREE.Group();    // the tilted axis
const squash = new THREE.Group();  // squash & stretch, pivots at the base
const spin = new THREE.Group();    // the slow turn
scene.add(rig); rig.add(tilt); tilt.add(squash); squash.add(spin);
squash.position.y = -H / 2;
const CY = 0.78 + H / 2;

let cupMat, lid, strawGroup; const hitTargets = [];
const STRAW_R = 0.072, STRAW_UP = 1.5, STRAW_DOWN = 3.2, STRAW_LEAN = -0.2;

function buildCup() {

  const cup = new THREE.Mesh(new THREE.LatheGeometry(profile.pts.map(p => new THREE.Vector2(p.r, p.y)), 180), cupMat);
  cup.castShadow = true; spin.add(cup); hitTargets.push(cup);

  // pebble-ice-dark liquid under a translucent lid
  const liquid = new THREE.Mesh(new THREE.CircleGeometry(0.985, 72), new THREE.MeshStandardMaterial({ color: 0x240806, roughness: 0.25 }));
  liquid.rotation.x = -Math.PI / 2; liquid.position.y = H - 0.13; spin.add(liquid);

  const lidRaw = [[1.060, H - 0.118], [1.078, H - 0.10], [1.083, H - 0.02], [1.079, H + 0.03], [1.062, H + 0.056], [1.032, H + 0.063], [0.992, H + 0.051], [0.93, H + 0.046], [0.70, H + 0.046], [0.672, H + 0.07], [0.60, H + 0.077], [0.565, H + 0.05], [0.0, H + 0.05]];
  lid = new THREE.Group(); spin.add(lid);
  const lidMat = new THREE.MeshPhysicalMaterial({ color: 0xf6f2ec, roughness: 0.32, transmission: 0.45, thickness: 0.08, ior: 1.45, clearcoat: 0.7, clearcoatRoughness: 0.18, side: THREE.DoubleSide });
  const lidMesh = new THREE.Mesh(new THREE.LatheGeometry(lidRaw.map(([r, y]) => new THREE.Vector2(r, y)), 160), lidMat);
  lidMesh.castShadow = true; lid.add(lidMesh); hitTargets.push(lidMesh);

  // red straw
  strawGroup = new THREE.Group(); strawGroup.position.set(0.30, H + 0.05, 0); strawGroup.rotation.set(0.04, 0, STRAW_LEAN); spin.add(strawGroup);
  const strawMat = new THREE.MeshPhysicalMaterial({ color: 0xd8241d, roughness: 0.26, clearcoat: 0.9, clearcoatRoughness: 0.12, side: THREE.DoubleSide });
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(STRAW_R, STRAW_R, STRAW_UP + STRAW_DOWN, 48, 1, true), strawMat);
  tube.position.y = (STRAW_UP - STRAW_DOWN) / 2; tube.castShadow = true; strawGroup.add(tube);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(STRAW_R * .8, STRAW_R * .8, 0.6, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0x3a0605, roughness: .6, side: THREE.BackSide }));
  inner.position.y = STRAW_UP - 0.3; strawGroup.add(inner);
  const lip = new THREE.Mesh(new THREE.RingGeometry(STRAW_R * .8, STRAW_R, 48), strawMat);
  lip.rotation.x = -Math.PI / 2; lip.position.y = STRAW_UP; strawGroup.add(lip);
}

// ───────────────────────────────── liquid: a coherent jet that beads up and breaks into droplets, plus spray and fizz
const MAX = 7000;
const dropGeo = new THREE.SphereGeometry(1, 16, 12);
const colaMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, envMapIntensity: 1.8, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.04, specularIntensity: 1 });
const jetMat = new THREE.MeshPhysicalMaterial({ color: 0x4a120c, envMapIntensity: 2.2, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.03, specularIntensity: 1, side: THREE.DoubleSide });

const drops = new THREE.InstancedMesh(dropGeo, colaMat, MAX);
const foams = new THREE.InstancedMesh(dropGeo, foamMat, MAX);
const splatMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, envMapIntensity: 0.5 });
const splats = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 24), splatMat, MAX);
for (const m of [drops, foams, splats]) { m.frustumCulled = false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.count = 0; m.setColorAt(0, new THREE.Color()); scene.add(m); }

const colaCols = BRAND.cola.map(c => new THREE.Color(c));
const foamCols = BRAND.foam.map(c => new THREE.Color(c));

// jet tubes: a small pool of dynamic tube meshes rebuilt every frame from the core particle chain
const RING = 80, SIDES = 14, POOL = 24;
const tubes = Array.from({ length: POOL }, () => {
  const g = new THREE.BufferGeometry(), idx = [];
  for (let j = 0; j < RING - 1; j++) for (let k = 0; k < SIDES; k++) {

  g.setIndex(idx);
  for (const n of ['position', 'normal']) { const at = new THREE.BufferAttribute(new Float32Array(RING * SIDES * 3), 3); at.setUsage(THREE.DynamicDrawUsage); g.setAttribute(n, at); }

});
const _c = new THREE.Vector3(), _tg = new THREE.Vector3(), _n1 = new THREE.Vector3(), _n2 = new THREE.Vector3(), _ref = new THREE.Vector3(0, 0, 1), _dir = new THREE.Vector3();

const extraSpurts = []; // taps on the live page

  const out = [], k0 = Math.floor(t / PERIOD);
  for (let k = k0 - 1; k <= k0 + 1; k++) SCHEDULE.forEach((e, i) => out.push({ s: e.s + k * PERIOD, seed: 101 + i * 977, type: e.type }));
  out.push(...extraSpurts);

  return out.filter(e => e.type === 'torrent' || !torr.some(T => e.s > T.s - TORRENT.anticipate - 1 && e.s < T.s + TORRENT.dur + 1.2));

function torrentFx(t) {

// ───────────────────────────────── 2D layers: gradient field, roundel ripples, fizz, grain
let W = 1080, Hh = 1350, DPR = 1, SC = 1;

  gr.addColorStop(0.55, '#EA6649');
  gr.addColorStop(0.69, '#E1322B');

    banked.then(b => {
      bank = { pop: b.pop.map(toBuffer), torrent: b.torrent.map(toBuffer) }; flush();
      const bed = new AudioBufferSourceNode(ctx, { buffer: toBuffer(b.ambient), loop: true }), fade = new GainNode(ctx, { gain: 0 });
      fade.gain.setTargetAtTime(1, ctx.currentTime, .8);
      bed.connect(fade).connect(master); bed.start();
    });
  }
  function set(on) {
    want = on;
    try { localStorage.setItem('swig-sound', on ? 'on' : 'off'); } catch {}
    if (on) open(); else ctx?.suspend().catch(() => {});
    show();
  }
  btn.addEventListener('click', () => set(!(want && running())));
  for (const type of ['pointerup', 'touchend', 'keydown']) addEventListener(type, e => { if (want && !running() && !btn.contains(e.target)) open(); }, { passive: true });
  document.addEventListener('visibilitychange', () => { if (ctx && want) (document.hidden ? ctx.suspend() : ctx.resume()).catch(() => {}); });
  show();
  const start = (e, late) => {
    const list = bank[e.type], src = new AudioBufferSourceNode(ctx, { buffer: list[e.seed % list.length] });
    src.connect(master); src.start(0, late);
  };
  // the tap that unlocks audio also launches a spurt whose sound is due before the finger lifts: hold it, then play it in sync
  function flush() {
    if (!bank || !running()) return;
    const now = performance.now();
    for (const p of pending) if (now - p.at < 1000) start(p.e, (now - p.at) / 1000);
    pending = [];
  }
  return {
    play(e, late) {
      if (!want) return;
      if (bank && running()) return start(e, late);
      const now = performance.now();
      pending = pending.filter(p => now - p.at < 1000).concat({ e, at: now - late * 1000 });
    },
  };
}

// ───────────────────────────────── boot
async function boot() {
  await Promise.all(['400 100px Pacifico', '500 40px "IBM Plex Mono"', '600 40px "IBM Plex Mono"', '600 20px "Instrument Sans"'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  buildCup();
  resize();
  renderAt(START); // warm up shaders
}
const ready = boot();

if (CAPTURE) {
  const out = canvas(1, 1), og = out.getContext('2d');
  window.__ready = ready.then(() => true);
  window.renderFrame = (t) => {
    renderAt(t);
    if (out.width !== W) { out.width = W; out.height = Hh; }
    og.imageSmoothingQuality = 'high';
    og.drawImage(bgCanvas, 0, 0, W, Hh); og.drawImage(glCanvas, 0, 0, W, Hh); og.drawImage(fxCanvas, 0, 0, W, Hh);
    return out.toDataURL('image/png');
  };
} else {
  const sound = makeSound();
  ready.then(() => {
    const t0 = performance.now(), cam = { x: 0, y: 0 }, ptr = { x: 0, y: 0 };
    let lastTap = -9, seed = 5000;
    const hint = document.getElementById('hint');
    setTimeout(() => hint.classList.add('show'), 1800);
    setTimeout(() => hint.classList.remove('show'), 7800);
    const now = () => (performance.now() - t0) / 1000 + START;
    addEventListener('resize', resize);
    const stage = document.getElementById('stage'), ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    const overCup = e => { ndc.set(e.clientX / W * 2 - 1, -(e.clientY / Hh) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.intersectObjects(hitTargets, false).length > 0; };
    addEventListener('pointermove', e => { ptr.x = e.clientX / W * 2 - 1; ptr.y = e.clientY / Hh * 2 - 1; stage.style.cursor = overCup(e) ? 'pointer' : 'default'; });
    stage.addEventListener('pointerdown', e => {
      const t = now();
      if (overCup(e)) {   // the cup itself: open the floodgates (one torrent at a time)
        if (extraSpurts.some(x => x.type === 'torrent' && t < x.s + TORRENT.dur + .4)) return;
        extraSpurts.push({ s: t + TORRENT.anticipate, seed: seed++, type: 'torrent' });
      } else {            // anywhere else: a regular pop
        if (t - lastTap < .7) return; lastTap = t;
        extraSpurts.push({ s: t + ANTICIPATE, seed: seed++, type: 'pop' });
      }
      if (extraSpurts.length > 8) extraSpurts.shift();
      hint.classList.remove('show');
    });
    let lastT = now();
    (function frame() {
      const t = now();
      cam.x += (ptr.x - cam.x) * .04; cam.y += (ptr.y - cam.y) * .04;
      camera.position.set(CAM_POS.x + cam.x * 1.1, CAM_POS.y - cam.y * .6, CAM_POS.z); camera.lookAt(CAM_TARGET);
      requestAnimationFrame(frame);
      renderAt(t);
      // each spurt's sound starts LEAD seconds early (the tap click, the eruption's rumble); skip any missed while the tab slept
      if (sound) for (const e of eventsNear(t)) { const at = e.s - SwigSFX.LEAD[e.type]; if (at > lastT && at <= t && t - at < .25) sound.play(e, t - at); }
      lastT = t;
    })();
  });
}
</script>
